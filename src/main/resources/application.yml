# 使用虹软人脸识别，需要申请sdk密钥（该项目示例搭配的的是milvus数据库）
config:
  arcface-sdk:
    version: "3.0"
    app-id: "xxxxxx"
    sdk-key: "xxxxxxxx"
    active_key: "#此处不要填写"
    detect-pool-size: 5
    compare-pool-size: 5



#redisson:
#  timeout: 3000            # 超时时间（毫秒）
#  address: "127.0.0.1:6379" # Redis地址
#  password: "" # Redis密码

jedis:
  nodes:
    - ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:16377}
  password: ${REDIS_PASSWORD:***REMOVED***}
  pool:
    minIdle: 64
    maxIdle: 64
    maxTotal: 128
  timeout: 500

# 缓存策略（Redis 不可用时自动降级为直接查库，不影响业务）
cache:
  face:
    # 人脸特征全量缓存过期时间（分钟），写操作会主动失效
    ttl-minutes: 30
  image:
    # 图片特征向量缓存过期时间（天），按文件 MD5 命中
    ttl-days: 7


